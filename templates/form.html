{% extends "base.html" %}
{% block title %}{{ 'Add student' if mode == 'add' else 'Edit student' }}{% endblock %}
{% block content %}
<h1>{{ 'Add student' if mode == 'add' else 'Edit student' }}</h1>
<form class="card" method="post">
  <label>Roll number <input name="roll_no" value="{{ s.roll_no or '' }}" required></label>
  <label>Full name <input name="name" value="{{ s.name or '' }}" required></label>
  <label>Email <input type="email" name="email" value="{{ s.email or '' }}" required></label>
  <label>Phone <input name="phone" value="{{ s.phone or '' }}"></label>
  <label>Gender
    <select name="gender">
      {% for g in ['Male', 'Female', 'Other'] %}<option {{ 'selected' if s.gender == g }}>{{ g }}</option>{% endfor %}
    </select>
  </label>
  <label>Date of birth <input type="date" name="dob" value="{{ s.dob or '' }}"></label>
  <label>Department
    <select name="department" required>
      {% for d in departments %}<option {{ 'selected' if s.department == d }}>{{ d }}</option>{% endfor %}
    </select>
  </label>
  <label>Year (1–4) <input type="number" name="year" min="1" max="4" value="{{ s.year or 1 }}" required></label>
  <label>CGPA (0–10) <input type="number" step="0.01" min="0" max="10" name="cgpa" value="{{ s.cgpa if s.cgpa is not none else '' }}"></label>
  <label>City <input name="city" value="{{ s.city or '' }}"></label>
  <label>Admission year <input type="number" name="admission_year" value="{{ s.admission_year or '' }}"></label>
  <div class="row">
    <button class="btn primary">{{ 'Add student' if mode == 'add' else 'Save changes' }}</button>
    <a class="btn" href="{{ url_for('index') }}">Cancel</a>
  </div>
</form>
{% endblock %}
